# Board-scoped Kconfig for blackpill_f411ce (STM32F411CE).
#
# Secondary, CONTROL-ONLY target: the F411 has no Wi-Fi, so OPC UA / networking
# is ESP32-C6-only. This target exercises the control + safety core (threads,
# MAX6675 reads, keep-alive/watchdog pulses) on the diversified MCU of the
# dual-socket carrier.
CONFIG_GPIO=y
CONFIG_SPI=y
