# Board-scoped Kconfig for esp32c6_devkitc/esp32c6/hpcore.
#
# The base prj.conf already selects GPIO/SPI/SENSOR/MAX6675/WATCHDOG. This file
# is the place for C6-specific overrides.
#
# Brownout: the architecture ("Boot, Reset, Flashing") requires the brownout
# detector on, treating a brownout reset like any other reset (boot disarmed).
# CONFIG_ESP_BROWNOUT_DET is defined only when hal_espressif's esp_system menu
# is sourced (it is not in this minimal build) and is enabled by the SoC default
# regardless, so it is intentionally NOT overridden here. Re-assert it once the
# esp_system/Wi-Fi path is pulled in by the OPC-UA milestone.

