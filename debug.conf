#
# Test / bench build ONLY. Adds the shell that the future fault-injection
# harness hangs off (architecture §"Test & Validation Plan"). NEVER ship a
# field image built with this file — an interactive shell on the control unit
# is a safety hazard.
#
#   west build -b <board> . -- -DEXTRA_CONF_FILE=debug.conf

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
