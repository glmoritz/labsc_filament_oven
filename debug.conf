# Test / bench build ONLY. Adds the shell that the future fault-injection
# harness hangs off (architecture §"Test & Validation Plan"). NEVER ship a
# field image built with this file — an interactive shell on the control unit
# is a safety hazard.
#
#   west build -b <board> . -- -DEXTRA_CONF_FILE=debug.conf

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y

# --- Source-level debugging (JTAG) ---
#
# Zephyr defaults to CONFIG_SIZE_OPTIMIZATIONS (-Os), which inlines, reorders
# and elides locals — single-stepping jumps around and variables read
# <optimized out>. -O0 makes the source map 1:1 with the instruction stream.
# Costs image size and stack depth; acceptable here (4 MB flash), and this file
# is bench-only anyway.
CONFIG_NO_OPTIMIZATIONS=y

# OpenOCD's "Zephyr" RTOS plugin — which boards/esp32c6-zephyr.cfg selects —
# needs this symbol table to enumerate threads. Without it you only ever see
# the bare CPU.
CONFIG_DEBUG_THREAD_INFO=y

# --- Bench instrumentation ---------------------------------------------------
# Status LED, per-cycle PID trace and preset bench tuning. See the project
# Kconfig for the individual switches and src/oven_debug.c for what they do.
# The LED needs the matching DT overlay (debug/<board>.overlay), which
# scripts/zephyr-project.sh applies alongside this file.
CONFIG_OVEN_DEBUG=y

# --- Diagnostics output routing ----------------------------------------------
# Send the log stream to the USB-Serial-JTAG (/dev/ttyACM0) instead of the
# console UART, via the chosen zephyr,log-uart node in the debug overlay. On
# this devkit uart0 is a physically different connector.
#
# LOG_BACKEND_UART defaults to 'n' as soon as SHELL_BACKEND_SERIAL is on (the
# shell would carry the logs itself), so it has to be asked for explicitly; and
# the shell's own log backend is turned off so trace lines are not duplicated
# onto the console.
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_LOG_BACKEND=n

# Two trace lines per control cycle, each with ~15 packed arguments. Deferred
# logging needs room for them plus the boot chatter.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
