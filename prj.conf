#
# labsc_filament_oven base configuration. See docs/ARCHITECTURE.md.
#
# ---------------------------------------------------------------------------
# Thread priority audit (architecture §"Thread priority audit").
# All application thread priorities are pinned EXPLICITLY in code
# (K_THREAD_DEFINE), never left to defaults. Cooperative negative priorities
# are used for the two real-time threads so they cannot be preempted by
# background work; the watchdog runs at the lowest preemptible priority so it
# starves first and the hardware watchdog expires — that starvation is the
# detector, by design.
#
#   PID thread      : K_PRIO_COOP(1)  (highest real-time)
#   Output thread   : K_PRIO_COOP(2)  (just below PID)
#   Watchdog thread : K_PRIO_PREEMPT(CONFIG_NUM_PREEMPT_PRIORITIES-1) (lowest)
#   main / log / shell / net : background preemptible
#
# The two RT threads are cooperative so background work cannot preempt them;
# they yield only by blocking (PID on its release semaphore, Output on its
# period sleep). The exact values live in src/oven_threads.h and each thread
# __ASSERTs its own actual priority at startup.
# ---------------------------------------------------------------------------

# --- No dynamic allocation (safety requirement) ------------------------------
# The application allocates nothing on the heap. A tiny pool is kept only
# because some subsystems insist on a non-zero size; the app never calls
# k_malloc.
CONFIG_HEAP_MEM_POOL_SIZE=256

# --- Real-time scheduling ----------------------------------------------------
CONFIG_NUM_COOP_PRIORITIES=16
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_TIMESLICING=n
CONFIG_MAIN_THREAD_PRIORITY=10

# --- Drivers required by the carrier -----------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_MAX6675=y
CONFIG_WATCHDOG=y

# --- Diagnostics / robustness ------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
# HW_STACK_PROTECTION gives the MPU (ARM) / PMP (RISC-V) stack guard, which
# supersedes the software STACK_SENTINEL wherever it is available — so the
# sentinel is intentionally not requested (it would be forced off anyway).
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ASSERT=y

# --- Asserts are SOFT: stop driving, keep monitoring -------------------------
# Zephyr's default assert_post_action() panics, which halts the very threads
# that report what went wrong. This project overrides it (src/shared.c) to raise
# a fault instead: latch FAULTED, drop the actuator, stay alive and diagnosable.
#
# ASSERT_TEST is what makes that legal. It removes the CODE_UNREACHABLE that
# Zephyr otherwise emits after the post-action hook, so a custom hook is allowed
# to return instead of aborting. Without it, our override is undefined
# behaviour. Named for its origin in Zephyr's assert tests; it is the supported
# mechanism for a returning hook.
CONFIG_ASSERT_TEST=y

# Zephyr's own "@ file:line" print happens inside the __ASSERT macro, before our
# hook runs, so the hook cannot rate-limit it — and a soft assert on a per-cycle
# path repeats forever. Turn it off: assert_post_action() still receives file and
# line and logs them itself, rate-limited, so nothing is lost.
CONFIG_ASSERT_VERBOSE=n

# --- Latched-fault retention -------------------------------------------------
# The fault record survives a warm reset via a noinit RAM section so the system
# boots into FAULTED after a safety trip (architecture §"Latched fault across
# reboot"). NVS mirroring is future work.
CONFIG_REBOOT=y
CONFIG_CRC=y

# --- Shell is OFF in the base image ------------------------------------------
# The fault-injection harness (debug.conf) is the only place a shell is enabled;
# an interactive shell must not be present in a field build.
CONFIG_SHELL=n
